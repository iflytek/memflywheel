packages:
  - "packages/*"
  - "examples"

# Disable pnpm v11's default 24h minimum-release-age supply-chain check so
# Dependabot PRs for freshly-published packages don't fail CI.
minimumReleaseAge: 60

allowBuilds:
  "@google/genai": true
  esbuild: true
  protobufjs: true
autoInstallPeers: false

overrides:
  esbuild: ">=0.28.1"
